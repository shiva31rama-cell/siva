<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Portfolio Pro</title><style>/* USE for students/developers/designers/freelancers. Replace PROJECTS and PROFILE with real data. */*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#111827}.wrap{max-width:1050px;margin:auto;padding:22px}nav{padding:14px 0;display:flex;justify-content:space-between}.hero{padding:90px 0}.hero h1{font-size:clamp(45px,8vw,85px);line-height:1;margin:0}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{border:1px solid #e5e7eb;border-radius:18px;padding:20px}.tag{display:inline-block;padding:6px 9px;border-radius:20px;background:#f2f4f7;margin:3px}input,textarea,button{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}form{display:grid;gap:10px;max-width:650px}.btn{background:#111;color:#fff}</style></head><body><main class="wrap"><nav><b id="name">Rama</b><a href="#contact">Contact</a></nav><section class="hero"><small>ENGINEER • BUILDER • LEARNER</small><h1 id="headline">I build useful things.</h1><p id="bio" class="muted"></p><a href="#projects"><button class="btn">View projects</button></a></section><section id="projects"><h2>Selected projects</h2><input id="q" placeholder="Filter projects..."><div id="grid" class="grid"></div></section><section id="contact" style="padding:70px 0"><h2>Contact</h2><form onsubmit="event.preventDefault();out.textContent='Demo message captured. Connect a server/API for delivery.'"><input required placeholder="Name"><input required type="email" placeholder="Email"><textarea required placeholder="Message"></textarea><button class="btn">Send</button></form><p id="out" class="muted"></p></section></main><script>/* BEGINNER MAP: PROFILE=content, PROJECTS=data, render=filter/UI, form=interaction. */const PROFILE={name:'Your Name',headline:'I build useful things.',bio:'Engineer, student and project maker. Replace this with your story, skills and outcomes.'};const PROJECTS=[['CyberRakshak','Cybersecurity • Web','A security learning/project platform.'],['Smart Device','Hardware • IoT','A connected prototype with sensors and software.'],['AI Research','AI • RAG','An experiment exploring retrieval and intelligent agents.']];name.textContent=PROFILE.name;headline.textContent=PROFILE.headline;bio.textContent=PROFILE.bio;function render(){let s=q.value.toLowerCase();grid.innerHTML=PROJECTS.filter(x=>x.join(' ').toLowerCase().includes(s)).map(x=>`<article class="card"><h3>${x[0]}</h3><span class="tag">${x[1]}</span><p class="muted">${x[2]}</p><a href="#contact">Discuss →</a></article>`).join('')}q.oninput=render;render()</script></body></html>
