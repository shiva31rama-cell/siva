<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu + Cart</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="top"><div><strong id="restaurantName">Your Restaurant</strong><small id="count">0 items</small></div><button id="ordersButton" class="orders">My Orders <span id="cartCount">0</span></button></header>
  <main class="container"><p class="eyebrow">DIGITAL MENU</p><h1 id="tagline">Choose what you want</h1><nav id="categoryNav" class="categories"></nav><section id="menu" class="menu-grid"></section></main>
  <aside id="ordersPanel" class="panel" aria-hidden="true"><div class="panel-head"><h2>My Orders</h2><button id="closeOrders">×</button></div><div id="cartItems"></div><div class="total"><span>Total</span><strong id="cartTotal">₹0</strong></div><p class="note">This is a temporary client-side total. Tell the waiter your final order.</p></aside>
  <script src="menu-data.js"></script><script src="script.js"></script>
</body>
</html>
