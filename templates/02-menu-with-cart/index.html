<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pro Menu + Cart</title><style>
/* USE THIS TEMPLATE for QR menus where customers choose items before telling a waiter. */
:root{--bg:#fff;--card:#f8fafc;--text:#111827;--muted:#64748b;--line:#e2e8f0;--accent:#111827}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1100px;margin:auto;padding:20px}.top{position:sticky;top:0;background:#ffffffee;backdrop-filter:blur(12px);z-index:10;border-bottom:1px solid var(--line)}.topin{max-width:1100px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hero{padding:40px 0 20px}h1{font-size:clamp(32px,6vw,58px);margin:6px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:12px}.chip,button{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff}.chip.active,button.primary{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--card)}.price{font-weight:800}.muted{color:var(--muted)}.panel{position:fixed;right:0;top:0;height:100%;width:min(430px,100%);background:#fff;z-index:20;box-shadow:-20px 0 50px #0002;padding:22px;transform:translateX(105%);transition:.25s;overflow:auto}.panel.open{transform:none}.panelhead{display:flex;justify-content:space-between}.row{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:6px;align-items:center}.total{display:flex;justify-content:space-between;font-size:20px;padding:20px 0}.notice{background:#f1f5f9;padding:12px;border-radius:12px;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:30}
</style></head><body><header class="top"><div class="topin"><b id="brand">Your Restaurant</b><button class="primary" onclick="openCart()">My Orders (<span id="count">0</span>)</button></div></header><main class="wrap"><section class="hero"><small class="muted">DIGITAL MENU</small><h1 id="tagline">Choose what you want</h1><p class="muted">Add items, review your temporary total, then tell the waiter your final order.</p></section><div class="toolbar"><input id="search" class="search" placeholder="Search menu..."><div id="cats"></div></div><section id="menu" class="grid"></section></main><aside id="panel" class="panel"><div class="panelhead"><h2>My Orders</h2><button onclick="closeCart()">✕</button></div><div id="cart"></div><div class="total"><span>Total</span><b id="total">₹0</b></div><p class="notice">Temporary client-side basket. No payment or order is sent to the restaurant.</p><button class="primary" style="width:100%" onclick="showWaiterNote()">Ready — Show Waiter Note</button></aside><div id="toast" class="toast"></div><script>
/* FILE MAP: MENU=data, render=UI, cart=state, localStorage=persistence, buttons=events. */
const BRAND={name:'Your Restaurant',tagline:'Choose what you want'};const MENU=[{id:1,name:'Paneer Tikka',cat:'Starters',price:180,desc:'Char-grilled cottage cheese.'},{id:2,name:'Veg Biryani',cat:'Main Course',price:220,desc:'Fragrant rice and vegetables.'},{id:3,name:'Masala Dosa',cat:'South Indian',price:120,desc:'Crisp dosa with chutneys.'},{id:4,name:'Filter Coffee',cat:'Beverages',price:70,desc:'Classic filter coffee.'}];
let cart=JSON.parse(localStorage.getItem('pro-menu-cart')||'{}'),category='All';brand.textContent=BRAND.name;tagline.textContent=BRAND.tagline;
function save(){localStorage.setItem('pro-menu-cart',JSON.stringify(cart))}function add(id){cart[id]=(cart[id]||0)+1;save();render();toast('Added to My Orders')}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];save();render()}function render(){const q=search.value.toLowerCase();const cats=['All',...new Set(MENU.map(x=>x.cat))];document.querySelector('#cats').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('');const rows=MENU.filter(x=>(category==='All'||x.cat===category)&&`${x.name} ${x.desc}`.toLowerCase().includes(q));menu.innerHTML=rows.map(x=>`<article class="card"><small class="muted">${x.cat}</small><h2>${x.name}</h2><p class="muted">${x.desc}</p><p class="price">₹${x.price}</p><button class="primary" onclick="add(${x.id})">＋ Add</button></article>`).join('');let total=0,n=0;cartEl=document.querySelector('#cart');cartEl.innerHTML=Object.entries(cart).map(([id,qty])=>{const x=MENU.find(m=>m.id==id);if(!x)return '';total+=x.price*qty;n+=qty;return `<div class="row"><div><b>${x.name}</b><div class="muted">₹${x.price} × ${qty}</div></div><div class="qty"><button onclick="change(${id},-1)">−</button><span>${qty}</span><button onclick="change(${id},1)">＋</button></div></div>`}).join('')||'<p class="muted">Your basket is empty.</p>';document.querySelector('#total').textContent='₹'+total;document.querySelector('#count').textContent=n}function openCart(){panel.classList.add('open')}function closeCart(){panel.classList.remove('open')}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1400)}function showWaiterNote(){const rows=Object.entries(cart).map(([id,q])=>{const x=MENU.find(m=>m.id==id);return `${x.name} × ${q}`}).join(', ');toast(rows?`Tell waiter: ${rows}`:'Add something first');}search.addEventListener('input',render);render();
</script></body></html>
