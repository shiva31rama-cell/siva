<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Premium reusable business website"><title>Premium Universal Website</title><style>
/* MASTER TEMPLATE: USE for restaurant, jewellery, portfolio, business or services. Change SITE and DATA first. */
:root{--bg:#fff;--text:#101828;--muted:#667085;--card:#f8fafc;--line:#eaecf0;--accent:#111827}*{box-sizing:border-box;scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}header{position:sticky;top:0;background:#ffffffdd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:10}.nav{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.links{display:flex;gap:18px}.links a{color:inherit;text-decoration:none}.menu{display:none}main{max-width:1180px;margin:auto;padding:0 22px}.hero{min-height:72vh;display:grid;align-content:center;max-width:900px}.eyebrow{color:var(--muted);letter-spacing:.16em;font-size:12px}.hero h1{font-size:clamp(42px,8vw,82px);line-height:.98;margin:10px 0}.hero p{font-size:20px;color:var(--muted);max-width:680px}.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border:0;border-radius:13px;padding:13px 17px;margin-top:12px}.section{padding:80px 0}.section h2{font-size:38px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}.muted{color:var(--muted)}form{display:grid;gap:12px;max-width:650px}input,textarea{padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit}textarea{min-height:140px}footer{padding:35px 22px;border-top:1px solid var(--line);color:var(--muted)}@media(max-width:700px){.links{display:none}.menu{display:block}.links.open{display:flex;position:absolute;top:60px;left:0;right:0;background:#fff;padding:20px;flex-direction:column}}
</style></head><body><header><div class="nav"><a class="brand" href="#home" id="brand">Your Brand</a><button class="menu" onclick="links.classList.toggle('open')">☰</button><nav id="links" class="links"><a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a></nav></div></header><main><section id="home" class="hero"><span id="eyebrow" class="eyebrow">WELCOME</span><h1 id="headline">Build a premium digital presence.</h1><p id="intro"></p><a id="cta" class="btn" href="#contact">Get Started</a></section><section id="about" class="section"><p class="eyebrow">ABOUT</p><h2>Built around your purpose.</h2><p id="aboutText" class="muted"></p></section><section id="services" class="section"><p class="eyebrow">CAPABILITIES</p><h2>What we offer</h2><div id="grid" class="grid"></div></section><section id="contact" class="section"><p class="eyebrow">CONTACT</p><h2>Let's talk.</h2><form id="form"><input id="name" required placeholder="Your name"><input id="email" required type="email" placeholder="Email"><textarea id="message" required placeholder="Tell us what you need"></textarea><button class="btn" type="submit">Send enquiry</button></form><p id="status" class="muted"></p></section></main><footer>© <span id="year"></span> <span id="footerBrand">Your Brand</span> · Premium starter template</footer><script>
/* BEGINNER MAP: SITE=content, CARDS=content, render=DOM, form handler=interaction. No backend is required for demo mode. */
const SITE={brand:'Your Brand',eyebrow:'WELCOME',headline:'Build a premium digital presence.',intro:'A production-minded front-end foundation that can become a restaurant, jewellery, portfolio, business or services site.',about:'Replace this text with your story, value proposition and trust signals. Keep the message specific to the customer.',cta:'Start a conversation'};
// SUGGESTION: when you add a backend, POST the form to /api/contact instead of showing demo status.
const CARDS=[['Service One','Explain your strongest offering in one clear sentence.'],['Service Two','Show the outcome customers receive, not only the feature.'],['Service Three','Add proof, process, pricing or a call-to-action here.']];
for(const [id,key] of [['brand','brand'],['eyebrow','eyebrow'],['headline','headline'],['intro','intro'],['aboutText','about']])document.getElementById(id).textContent=SITE[key];cta.textContent=SITE.cta;footerBrand.textContent=SITE.brand;year.textContent=new Date().getFullYear();grid.innerHTML=CARDS.map(([a,b])=>`<article class="card"><h3>${a}</h3><p class="muted">${b}</p></article>`).join('');form.addEventListener('submit',e=>{e.preventDefault();status.textContent=`Thanks ${name.value}. Demo mode received your enquiry locally.`;form.reset()});
</script></body></html>
