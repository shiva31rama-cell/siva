<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Pro</title><style>/* USE for companies, startups and local businesses. Add real proof, team, FAQs and backend CRM later. */*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#101828}.wrap{max-width:1150px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #eee}.hero{padding:85px 0}.hero h1{font-size:clamp(42px,7vw,76px);max-width:900px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:22px;border:1px solid #e5e7eb;border-radius:18px;background:#fafafa}.muted{color:#667085}input,textarea,button{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}form{display:grid;gap:10px;max-width:650px}.btn{background:#111;color:#fff}.section{padding:65px 0}</style></head><body><main class="wrap"><header><b id="brand">Your Company</b><nav><a href="#solutions">Solutions</a> · <a href="#proof">Proof</a> · <a href="#contact">Contact</a></nav></header><section class="hero"><small>TRUST • DELIVERY • RESULTS</small><h1 id="headline">Make your business easier to choose.</h1><p id="intro" class="muted"></p><a href="#contact"><button class="btn">Talk to us</button></a></section><section id="solutions" class="section"><h2>Solutions</h2><div id="grid" class="grid"></div></section><section id="proof" class="section"><h2>Proof</h2><div class="grid"><article class="card"><b>98%</b><p class="muted">Example customer satisfaction metric.</p></article><article class="card"><b>24/7</b><p class="muted">Example support promise.</p></article><article class="card"><b>5+ yrs</b><p class="muted">Example experience metric.</p></article></div></section><section id="contact" class="section"><h2>Request a conversation</h2><form onsubmit="event.preventDefault();status.textContent='Demo lead captured. Connect your CRM endpoint for production.'"><input required placeholder="Name"><input required type="email" placeholder="Work email"><input required placeholder="Company"><textarea required placeholder="What are you trying to solve?"></textarea><button class="btn">Submit</button></form><p id="status" class="muted"></p></section></main><script>/* SUGGESTION: connect form to /api/leads and add server-side validation, spam protection and CRM integration. */const DATA=[['Strategy','Clarify the problem, audience and measurable outcome.'],['Implementation','Deliver a practical solution with milestones and ownership.'],['Support','Measure results and continuously improve the system.']];grid.innerHTML=DATA.map(x=>`<article class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></article>`).join('');intro.textContent='A premium conversion-focused foundation for companies, startups and local businesses.';</script></body></html>
