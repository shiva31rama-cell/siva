<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services Pro</title><style>/* USE for agencies, repair teams, consultants, freelancers and professional services. */*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#111827}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{padding:80px 0}.hero h1{font-size:clamp(42px,7vw,75px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{border:1px solid #e5e7eb;border-radius:18px;padding:22px}.muted{color:#667085}.price{font-size:22px;font-weight:800}input,select,textarea,button{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}form{display:grid;gap:10px;max-width:650px}.btn{background:#111;color:#fff}.section{padding:65px 0}</style></head><body><main class="wrap"><header><b>YOUR SERVICES</b> · <a href="#services">Services</a> · <a href="#book">Book</a></header><section class="hero"><small>PROFESSIONAL SERVICES</small><h1>Expert help, clearly packaged.</h1><p class="muted">A service catalogue with filtering, package cards and a lead/request flow.</p></section><section id="services" class="section"><h2>Services</h2><select id="filter"><option>All</option><option>Design</option><option>Development</option><option>Consulting</option></select><div id="grid" class="grid"></div></section><section id="book" class="section"><h2>Request a service</h2><form onsubmit="event.preventDefault();out.textContent='Request captured in demo mode. Connect /api/leads for production.'"><input required placeholder="Name"><input required type="email" placeholder="Email"><select id="service" required><option value="">Choose service</option></select><textarea required placeholder="Requirements"></textarea><button class="btn">Request</button></form><p id="out" class="muted"></p></section></main><script>/* DATA-FIRST DESIGN: service changes happen here; backend can later replace the demo form handler. */const SERVICES=[['Website Development','Development','₹25,000+'],['Brand Design','Design','₹15,000+'],['Technical Consultation','Consulting','₹2,000/session'],['Automation Setup','Development','₹10,000+']];function render(){grid.innerHTML=SERVICES.filter(x=>filter.value==='All'||x[1]===filter.value).map(x=>`<article class="card"><small>${x[1]}</small><h3>${x[0]}</h3><p class="price">${x[2]}</p><p class="muted">Custom scope, timeline and deliverables agreed before work begins.</p></article>`).join('');service.innerHTML='<option value="">Choose service</option>'+SERVICES.map(x=>`<option>${x[0]}</option>`).join('')}filter.onchange=render;render()</script></body></html>
