<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Small Shop Pro</title><style>/* USE for small shops/catalogues. Demo cart is local only; add backend, inventory and payment provider before production. */*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#111827}.wrap{max-width:1100px;margin:auto;padding:20px}header{position:sticky;top:0;background:#ffffffeF;padding:15px;z-index:5;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.hero{padding:65px 0}.hero h1{font-size:clamp(42px,7vw,72px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{border:1px solid #e5e7eb;border-radius:18px;padding:18px}.muted{color:#667085}button,input,select{padding:11px;border:1px solid #ddd;border-radius:10px}.btn{background:#111;color:#fff}.drawer{position:fixed;right:0;top:0;width:min(420px,100%);height:100%;background:#fff;z-index:10;padding:20px;box-shadow:-15px 0 40px #0002;transform:translateX(105%);transition:.25s}.drawer.open{transform:none}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}</style></head><body><header><b>YOUR SHOP</b><span><input id="q" placeholder="Search"><button onclick="drawer.classList.add('open')">Cart (<span id="count">0</span>)</button></span></header><main class="wrap"><section class="hero"><small>SMALL BUSINESS • SIMPLE SHOPPING</small><h1>Products people want.</h1><p class="muted">Responsive catalogue, search, category filter, persistent cart and temporary checkout summary.</p></section><select id="cat"><option>All</option><option>Home</option><option>Gifts</option><option>Accessories</option></select><section id="grid" class="grid"></section></main><aside id="drawer" class="drawer"><button onclick="drawer.classList.remove('open')">Close</button><h2>Your Cart</h2><div id="cart"></div><h3>Total ₹<span id="total">0</span></h3><button class="btn" onclick="alert('Demo checkout only. Connect backend/payment before real sales.')">Checkout</button></aside><script>/* CART ENGINE: state -> localStorage -> render. This pattern can be reused in menu/shop projects. */const PRODUCTS=[['Handmade Notebook','Home',299],['Gift Box','Gifts',599],['Canvas Tote','Accessories',399],['Desk Organizer','Home',499]];let bag=JSON.parse(localStorage.getItem('shop-bag')||'{}');function save(){localStorage.setItem('shop-bag',JSON.stringify(bag))}function add(i){bag[i]=(bag[i]||0)+1;save();render()}function change(i,n){bag[i]=(bag[i]||0)+n;if(bag[i]<=0)delete bag[i];save();render()}function render(){let s=q.value.toLowerCase();grid.innerHTML=PRODUCTS.map((x,i)=>(cat.value==='All'||cat.value===x[1])&&x.join(' ').toLowerCase().includes(s)?`<article class="card"><small>${x[1]}</small><h3>${x[0]}</h3><b>₹${x[2]}</b><br><button class="btn" onclick="add(${i})">Add to cart</button></article>`:'').join('');let t=0,n=0;cart.innerHTML=Object.entries(bag).map(([i,c])=>{t+=PRODUCTS[i][2]*c;n+=c;return `<div class="row"><span>${PRODUCTS[i][0]} × ${c}</span><span><button onclick="change(${i},-1)">−</button><button onclick="change(${i},1)">＋</button></span></div>`}).join('')||'<p>Empty</p>';total.textContent=t;count.textContent=n}q.oninput=render;cat.onchange=render;render()</script></body></html>
