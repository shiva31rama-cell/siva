<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewellery Atelier</title><style>/* USE for gold/jewellery brands. Product prices are demo data; connect inventory/metal-rate APIs later. */*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fff;color:#241f15}.wrap{max-width:1150px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fffffff2;z-index:5}.hero{padding:80px 0}.hero h1{font-size:clamp(42px,7vw,78px);font-weight:500}.tools{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:12px;border:1px solid #d8d1c4;border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{border:1px solid #e6dfd3;border-radius:18px;overflow:hidden}.pic{height:210px;background:#eee;display:grid;place-items:center;font-size:50px}.body{padding:18px}.wish{float:right}.quote{background:#faf8f2;padding:20px;border-radius:18px;margin-top:30px}.muted{color:#766f63}</style></head><body><main class="wrap"><header><b>SRΙ HASH ATELIER</b><nav><a href="#collection">Collection</a> · <a href="#quote">Enquiry</a></nav></header><section class="hero"><small>TIMELESS CRAFT</small><h1>Jewellery with a story.</h1><p class="muted">Premium catalogue starter for gold, diamond and jewellery businesses.</p></section><section id="collection"><div class="tools"><input id="q" placeholder="Search jewellery..."><select id="cat"><option>All</option><option>Necklace</option><option>Earrings</option><option>Rings</option></select></div><br><div id="grid" class="grid"></div></section><section id="quote" class="quote"><h2>Request a consultation</h2><form onsubmit="event.preventDefault();msg.textContent='Demo enquiry captured. Connect your CRM/API for real submissions.'"><input required placeholder="Name"><input required placeholder="Phone"><input required placeholder="Interested piece"><button>Request consultation</button></form><p id="msg" class="muted"></p></section></main><script>/* SUGGESTION: never hard-code live gold rates. Fetch a trusted rate source in a backend and display a timestamp. */const P=[['Heritage Necklace','Necklace','₹—'],['Temple Earrings','Earrings','₹—'],['Classic Solitaire Ring','Rings','₹—'],['Everyday Gold Chain','Necklace','₹—']];function render(){let qv=q.value.toLowerCase();grid.innerHTML=P.filter(x=>(cat.value==='All'||x[1]===cat.value)&&x[0].toLowerCase().includes(qv)).map((x,i)=>`<article class="card"><div class="pic">◇</div><div class="body"><button class="wish" onclick="this.textContent=this.textContent==='♡'?'♥':'♡'">♡</button><small>${x[1]}</small><h3>${x[0]}</h3><b>${x[2]}</b><p class="muted">Price depends on live metal rate, weight and making charges.</p></div></article>`).join('')}q.oninput=render;cat.onchange=render;render()</script></body></html>
