<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Pro</title><style>/* USE for restaurants needing website + searchable menu + temporary cart + reservation enquiry. */*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff;color:#171717}.wrap{max-width:1150px;margin:auto;padding:20px}header{position:sticky;top:0;background:#fffc;backdrop-filter:blur(12px);padding:14px;z-index:4;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.hero{padding:70px 0}.hero h1{font-size:clamp(42px,8vw,78px);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:20px;border:1px solid #eee;border-radius:18px;background:#fafafa}.muted{color:#667085}button,input,textarea{padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff}button{cursor:pointer}.dark{background:#151515;color:#fff}.dark .card,.dark input,.dark textarea{background:#222;color:#fff;border-color:#444}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}.cart{position:fixed;right:0;top:0;height:100%;width:min(420px,100%);background:#fff;padding:20px;box-shadow:-10px 0 40px #0002;transform:translateX(105%);transition:.25s;z-index:9}.cart.open{transform:none}.btn{background:#111;color:#fff}.section{padding:60px 0}form{display:grid;gap:10px;max-width:600px}</style></head><body><header><b id="brand">Annapurna Kitchen</b><nav><a href="#menu">Menu</a> · <a href="#reserve">Reserve</a> · <button onclick="cart.classList.add('open')">Orders <span id="count">0</span></button></nav></header><main class="wrap"><section class="hero"><small>AUTHENTIC • FRESH • WARM</small><h1>Food worth gathering for.</h1><p class="muted">Premium restaurant starter with menu discovery, temporary ordering and enquiry flows.</p><a href="#menu"><button class="btn">Explore Menu</button></a></section><section id="menu" class="section"><h2>Menu</h2><input id="q" placeholder="Search dishes..."><div id="grid" class="grid"></div></section><section id="reserve" class="section"><h2>Reservation enquiry</h2><form onsubmit="event.preventDefault();alert('Demo enquiry saved locally. Connect /api/reservations for real bookings.')"><input required placeholder="Name"><input required type="email" placeholder="Email"><input required type="date"><input required type="number" min="1" max="20" placeholder="Guests"><textarea required placeholder="Special request"></textarea><button class="btn">Send enquiry</button></form></section></main><aside id="cart" class="cart"><button onclick="cart.classList.remove('open')">Close</button><h2>My Orders</h2><div id="items"></div><h3>Total ₹<span id="total">0</span></h3><p class="muted">Temporary total only. Tell the waiter your final order.</p></aside><script>/* MENU is data. add/change/render are the core reusable cart functions. */const MENU=[['Paneer Tikka','Starters',180],['Veg Biryani','Mains',220],['Masala Dosa','South Indian',120],['Filter Coffee','Drinks',70]];let basket=JSON.parse(localStorage.getItem('restaurant-basket')||'{}');function save(){localStorage.setItem('restaurant-basket',JSON.stringify(basket))}function add(i){basket[i]=(basket[i]||0)+1;save();render()}function change(i,n){basket[i]=(basket[i]||0)+n;if(basket[i]<=0)delete basket[i];save();render()}function render(){let s=q.value.toLowerCase();grid.innerHTML=MENU.map((x,i)=>x[0].toLowerCase().includes(s)?`<article class="card"><small>${x[1]}</small><h3>${x[0]}</h3><b>₹${x[2]}</b><br><button class="btn" onclick="add(${i})">＋ Add</button></article>`:'').join('');let t=0,n=0;items.innerHTML=Object.entries(basket).map(([i,c])=>{t+=MENU[i][2]*c;n+=c;return `<div class="row"><span>${MENU[i][0]} × ${c}</span><span><button onclick="change(${i},-1)">−</button><button onclick="change(${i},1)">＋</button></span></div>`}).join('')||'<p>Empty</p>';total.textContent=t;count.textContent=n}q.oninput=render;render()</script></body></html>
